name: cargo-sunrise-mod
description: Sunrise's registry tool and release verifier, built from the sunrise-org/sunrise commit in .github/sunrise-rev
inputs:
  registry:
    description: The checkout whose .github/sunrise-rev names the commit
    default: .
runs:
  using: composite
  steps:
    - id: rev
      shell: bash
      env:
        REGISTRY_CHECKOUT: ${{ inputs.registry }}
      run: |
        rev=$(tr -d '[:space:]' < "$REGISTRY_CHECKOUT/.github/sunrise-rev")
        [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.github/sunrise-rev is not a full commit hash"; exit 1; }
        echo "rev=$rev" >> "$GITHUB_OUTPUT"
    # The publisher executes these tools with write privileges. Build from the pinned
    # source every time rather than executing a binary restored from Actions cache.
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: sunrise-org/sunrise
        ref: ${{ steps.rev.outputs.rev }}
        path: .sunrise
        persist-credentials: false
    - shell: bash
      working-directory: .sunrise
      run: |
        cargo install --locked --path crates/cargo-sunrise-mod --root ~/.sunrise-tool
        cargo install --locked --path crates/sunrise-release-sign --root ~/.sunrise-tool
    - shell: bash
      run: echo "$HOME/.sunrise-tool/bin" >> "$GITHUB_PATH"
