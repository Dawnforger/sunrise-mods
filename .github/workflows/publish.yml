name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refreshes the release and Nightly metadata, and the index's download and star counts.
  schedule:
    - cron: "23 */3 * * *"

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      legacy_artifact: ${{ steps.legacy.outputs.name }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: https://github.com/${{ github.repository }}/releases/download/
      SITE: https://sunrise-org.github.io/sunrise-mods/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/tool
      - uses: ./.github/actions/registry-data
      - run: mkdir -p mods files site
      - run: cargo-sunrise-mod sunrise-mod registry list . > files.txt
      - run: cargo-sunrise-mod sunrise-mod registry list . --build-assets > descriptors.json
      # As in check: the cache keeps our own runs out of the download counts.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: files
          key: smod-files-${{ hashFiles('files.txt', 'descriptors.json') }}
          restore-keys: smod-files-
      # Nothing becomes a public asset here before the build below has checked it. A file comes from its
      # `<id>-<version>` release here, else from the author's release for a stable row or `staging` for an older one;
      # each download stops at the tool's size limit, or at the size a verified descriptor gives its archive.
      - name: Download every listed file not cached
        run: |
          python3 -I scripts/fetch_files.py "${{ github.repository }}" files.txt files
          python3 -I scripts/fetch_files.py "${{ github.repository }}" descriptors.json files
          cargo-sunrise-mod sunrise-mod registry list . --build-assets --files files > archives.json
          python3 -I scripts/fetch_files.py "${{ github.repository }}" archives.json files
      - name: Build index.json
        run: |
          build() {
            cargo-sunrise-mod sunrise-mod registry build . --files files --out site/index.json \
              --release "$RELEASE" --site "$SITE" --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --releases registry-data/releases.json --sdk-data registry-data/sdk-data \
              --nightly-build registry-data/nightly-build.json "$@"
          }
          # The build checks every package, descriptor and archive; only then are the ones this repository's
          # releases lack copied into `<id>-<version>` under their own names, where the index points.
          build
          for list in files.txt descriptors.json archives.json; do
            python3 -I scripts/fetch_files.py "${{ github.repository }}" "$list" files --mirror
          done
          # GitHub's download and star counts for the files and sources the index lists, then the index with them.
          python3 -I scripts/fetch_counts.py site/index.json > counts.json
          build --counts counts.json
      - name: Build sources.json
        env:
          SUNRISE_REGISTRY_INDEX: site/index.json
        run: python3 -I scripts/build_sources.py build . --out site/sources.json
      - name: Add the images
        run: for d in icons screenshots; do [ -d "$d" ] && cp -r "$d" site/; done; true
      - name: Preserve the complete legacy site for Pages
        id: legacy
        run: |
          tar -C site -cf "$RUNNER_TEMP/legacy-site.tar" .
          echo "name=legacy-site-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.legacy.outputs.name }}
          path: ${{ runner.temp }}/legacy-site.tar
          if-no-files-found: error

  registry_v2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      unsigned: ${{ steps.prepare.outputs.unsigned }}
      pages: ${{ steps.prepare.outputs.pages }}
      sha256: ${{ steps.prepare.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the v2 registry tool
        run: cargo build --locked --manifest-path bot/Cargo.toml --target-dir target --release
      - name: Generate and validate the v2 catalogue
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bot=target/release/registry-bot
          serial=$(date -u +%s)
          if [[ ! -f registry/index-key.pub || "$GITHUB_REF" != refs/heads/main ]]; then
            "$bot" index . --serial "$serial" --out v2-stage
            echo 'Registry v2 was checked offline. Publication needs the public key and main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$bot" builds --out offered-builds.json
          cache=() after=()
          # Live unavailability prevents reuse, not generation. Deploy checks the
          # retained snapshot for the last keyed deployment as well as live Pages.
          if python3 -I .github/registry-v2/live.py --bot "$bot" --out v2-previous \
              && [[ -f v2-previous/index.json ]]; then
            cache=(--cache v2-previous/index.json)
            after=(--after v2-previous/index.json)
          fi
          "$bot" fit . --builds offered-builds.json "${cache[@]}" --out registry/fit
          "$bot" index . --serial "$serial" --out v2-stage --generated-fit "${after[@]}"
          tar -C v2-stage -cf "$RUNNER_TEMP/v2-pages.tar" pages
          echo "sha256=$(sha256sum < v2-stage/index.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "unsigned=unsigned-v2-index-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "pages=v2-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare.outputs.unsigned != ''
        with:
          name: ${{ steps.prepare.outputs.unsigned }}
          path: v2-stage/index.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare.outputs.pages != ''
        with:
          name: ${{ steps.prepare.outputs.pages }}
          path: ${{ runner.temp }}/v2-pages.tar
          if-no-files-found: error

  sign:
    needs: registry_v2
    if: github.ref == 'refs/heads/main' && needs.registry_v2.outputs.unsigned != ''
    runs-on: ubuntu-latest
    environment: registry-signing
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.sign.outputs.name }}
    steps:
      - name: Require the current main tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_SHA" != "$tip" ]]; then
            echo 'Refusing to publish a commit other than the current main tip.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: registry/index-key.pub
          sparse-checkout-cone-mode: false
      - name: Install minisign for signing only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.registry_v2.outputs.unsigned }}
          path: payload
      - name: Verify the artifact hash and sign the index
        id: sign
        env:
          EXPECTED_SHA256: ${{ needs.registry_v2.outputs.sha256 }}
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -f registry/index-key.pub && "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  payload/index.json\n' "$EXPECTED_SHA256" | sha256sum --check --status
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "${REGISTRY_SIGNING_KEY:?missing registry signing key}" > "$key"
          unset REGISTRY_SIGNING_KEY
          minisign -S -s "$key" -m payload/index.json -t 'Sunrise mod registry v2'
          echo "name=signed-v2-index-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.sign.outputs.name }}
          path: |
            payload/index.json
            payload/index.json.minisig
          if-no-files-found: error

  assemble:
    needs: [publish, registry_v2, sign]
    if: always() && !cancelled() && needs.publish.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      v2_failed: ${{ steps.overlay.outputs.v2_failed }}
      carried: ${{ steps.overlay.outputs.carried }}
      snapshot: ${{ steps.overlay.outputs.snapshot }}
      pages_artifact: ${{ steps.overlay.outputs.pages_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.publish.outputs.legacy_artifact }}
      - name: Record the exact legacy files before adding v2
        run: |
          mkdir site
          tar -C site -xf legacy-site.tar
          (cd site && find . -type f -print0 | sort -z | xargs -0r sha256sum) > legacy-before.sha256
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: signed
        if: needs.sign.result == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.sign.outputs.signed }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: images
        if: needs.sign.result == 'success'
        continue-on-error: true
        with:
          name: ${{ needs.registry_v2.outputs.pages }}
      - name: Authenticate the candidate or recover the last complete v2 snapshot
        id: overlay
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE: ${{ needs.registry_v2.result }}
          SIGNED: ${{ steps.signed.outcome }}
          IMAGES: ${{ steps.images.outcome }}
        run: |
          set -euo pipefail
          echo "pages_artifact=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [[ ! -f registry/index-key.pub ]]; then
            if [[ "$PREPARE" != success ]]; then
              echo 'v2_failed=true' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          verifier="$RUNNER_TEMP/index-verifier/release/registry-bot"
          if ! cargo build --locked --manifest-path bot/verifier/Cargo.toml \
              --target-dir "$RUNNER_TEMP/index-verifier" --release; then
            echo 'NO_AUTHENTICATED_V2_SNAPSHOT: the independent verifier is unavailable; preserving the existing Pages site.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          args=()
          if [[ "$SIGNED" != success || "$IMAGES" != success ]]; then
            args=(--candidate unavailable-v2-candidate)
          fi
          if ! python3 -I .github/registry-v2/live.py --bot "$verifier" --assemble site "${args[@]}"; then
            echo 'NO_AUTHENTICATED_V2_SNAPSHOT: preserving the existing Pages site without deploying.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "snapshot=v2-snapshot-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if grep -qx 'carried=true' "$GITHUB_OUTPUT"; then
            echo 'v2_failed=true' >> "$GITHUB_OUTPUT"
            echo 'The new v2 catalogue failed. Deploying the legacy site with the previous authenticated v2 snapshot.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prove the legacy site files are byte-identical
        run: |
          (cd site && find . -path ./v2 -prune -o -type f -print0 | sort -z | xargs -0r sha256sum) > legacy-after.sha256
          diff -u legacy-before.sha256 legacy-after.sha256
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: ${{ steps.overlay.outputs.pages_artifact }}
          path: site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.overlay.outputs.snapshot != ''
        with:
          name: ${{ steps.overlay.outputs.snapshot }}
          path: site/v2/
          if-no-files-found: error

  deploy:
    needs: assemble
    if: always() && !cancelled() && needs.assemble.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}index.json
    steps:
      - name: Require the current main tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_SHA" != "$tip" ]]; then
            echo 'Refusing to publish a commit other than the current main tip.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/registry-v2
            bot/src/index_signature.rs
            bot/verifier
            registry/index-key.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.assemble.outputs.snapshot != ''
        with:
          name: ${{ needs.assemble.outputs.snapshot }}
          path: deployed-candidate
      - name: Check the signed serial against the verified live deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CARRIED: ${{ needs.assemble.outputs.carried }}
        run: |
          set -euo pipefail
          if [[ -f registry/index-key.pub ]]; then
            cargo build --locked --manifest-path bot/verifier/Cargo.toml \
              --target-dir "$RUNNER_TEMP/index-verifier" --release
            args=()
            if [[ "$CARRIED" == true ]]; then args=(--carried); fi
            python3 -I .github/registry-v2/live.py --bot "$RUNNER_TEMP/index-verifier/release/registry-bot" \
              --guard-deploy deployed-candidate "${args[@]}"
          fi
          # The verification can span network requests. Do not deploy a commit that stopped being main in the meantime.
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$GITHUB_SHA" == "$tip" ]]
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ needs.assemble.outputs.pages_artifact }}

  report-v2-failure:
    needs: [assemble, deploy]
    if: always() && !cancelled() && needs.deploy.result == 'success' && needs.assemble.outputs.v2_failed == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo 'The legacy site deployed, but the new v2 index did not publish.'
          exit 1
