name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refreshes the release and Nightly metadata, and the index's download and star counts.
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}index.json
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: https://github.com/${{ github.repository }}/releases/download/
      SITE: https://sunrise-org.github.io/sunrise-mods/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/tool
      - uses: ./.github/actions/registry-data
        with:
          checkout: .
          warn: 'true'
      - run: mkdir -p mods files site
      - run: cargo-sunrise-mod sunrise-mod registry list . > files.txt
      # As in check: the cache keeps our own runs out of the download counts.
      - uses: actions/cache@v4
        with:
          path: files
          key: smod-files-${{ hashFiles('files.txt') }}
          restore-keys: smod-files-
      # A file not yet in its `<id>-<version>` release here is copied into it under its own name: from the author's
      # release for a stable row, from `staging` for an older one.
      - name: Publish new versions' files as releases
        run: python3 -I scripts/fetch_files.py "${{ github.repository }}" files.txt files --publish
      - name: Publish the stable builds' descriptors and archives beside them
        run: |
          cargo-sunrise-mod sunrise-mod registry list . --build-assets > descriptors.json
          python3 -I scripts/fetch_files.py "${{ github.repository }}" descriptors.json files --publish
          cargo-sunrise-mod sunrise-mod registry list . --build-assets --files files > archives.json
          python3 -I scripts/fetch_files.py "${{ github.repository }}" archives.json files --publish
      - name: Build index.json
        run: |
          build() {
            cargo-sunrise-mod sunrise-mod registry build . --files files --out site/index.json \
              --release "$RELEASE" --site "$SITE" --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --releases registry-data/releases.json --sdk-data registry-data/sdk-data \
              --nightly-build registry-data/nightly-build.json --nightly registry-data/nightly.json "$@"
          }
          build
          # GitHub's download and star counts for the files and sources the index lists, then the index with them.
          python3 -I scripts/fetch_counts.py site/index.json > counts.json
          build --counts counts.json
      - name: Add the images
        run: for d in icons screenshots; do [ -d "$d" ] && cp -r "$d" site/; done; true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
