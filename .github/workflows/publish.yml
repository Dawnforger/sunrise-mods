name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refreshes the index's download and star counts; nothing else changes without a push.
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}index.json
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: https://github.com/${{ github.repository }}/releases/download/
      SITE: https://sunrise-org.github.io/sunrise-mods/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/tool
      - run: mkdir -p mods files site
      - run: cargo-sunrise-mod sunrise-mod registry list . > files.txt
      # As in check: the cache keeps our own runs out of the download counts.
      - uses: actions/cache@v4
        with:
          path: files
          key: smod-files-${{ hashFiles('files.txt') }}
          restore-keys: smod-files-
      - name: Publish new versions' files as releases
        run: python3 -I scripts/fetch_files.py "${{ github.repository }}" files.txt files --publish
      - name: Build index.json
        run: |
          build() {
            cargo-sunrise-mod sunrise-mod registry build . --files files --out site/index.json \
              --release "$RELEASE" --site "$SITE" --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$@"
          }
          build
          # GitHub's download and star counts for the files and sources the index lists, then the index with them.
          python3 -I scripts/fetch_counts.py site/index.json > counts.json
          build --counts counts.json
      - name: Build sources.json
        run: python3 -I scripts/build_sources.py build . --out site/sources.json
      - name: Add the images
        run: for d in icons screenshots; do [ -d "$d" ] && cp -r "$d" site/; done; true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
