name: Check registry release PR
run-name: Registry release PR ${{ inputs.pr }} at ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open registry release PR number
        type: string
        required: true
      head:
        description: Exact release PR head commit (40 lowercase hexadecimal characters)
        type: string
        required: true

permissions: {}

concurrency:
  group: registry-v2-release-check-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  pending:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mark the current release head pending
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_HEAD: ${{ inputs.head }}
        run: python3 -I bot/ci/release_pr.py pending

  verify:
    name: Verify release
    needs: pending
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      attestations: read
    outputs:
      attempt: ${{ github.run_attempt }}
      source: ${{ steps.source.outputs.artifact-id }}
      previous: ${{ steps.previous.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build the trusted registry checker
        run: cargo build --locked --manifest-path bot/Cargo.toml --target-dir "$RUNNER_TEMP/registry-checker"
      - name: Verify PR scope, signatures, package and page without checking out the PR
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_HEAD: ${{ inputs.head }}
          REGISTRY_BOT: ${{ runner.temp }}/registry-checker/debug/registry-bot
        run: python3 -I bot/ci/release_pr.py verify "$RUNNER_TEMP/release-checked"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: source
        with:
          name: release-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-checked/source/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: previous
        if: steps.verify.outputs.previous == 'true'
        with:
          name: release-previous-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-checked/previous/
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: Build / ${{ matrix.host }}
    needs: verify
    if: needs.verify.outputs.attempt == github.run_attempt && needs.verify.outputs.source != ''
    runs-on: ${{ matrix.runner }}
    # Package build scripts and proc macros get no repository cache access.
    cache-mode: none
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Linux
            runner: ubuntu-latest
            operation: build
          - host: macOS
            runner: macos-15
            operation: check
          - host: Windows
            runner: windows-latest
            operation: check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.source }}
          path: ${{ runner.temp }}/registry-release-source/
          digest-mismatch: error
      - name: Use the signed mod tool against the package's pinned SDK
        shell: bash
        env:
          OPERATION: ${{ matrix.operation }}
        run: python -I bot/ci/build_release.py "$RUNNER_TEMP/registry-release-source" "$OPERATION"

  scanner:
    name: Scanner
    needs: verify
    if: needs.verify.outputs.attempt == github.run_attempt && needs.verify.outputs.source != ''
    permissions:
      contents: read
    uses: ./.github/workflows/scan.yml
    with:
      source-artifact: ${{ needs.verify.outputs.source }}
      previous-artifact: ${{ needs.verify.outputs.previous }}

  report:
    needs: [pending, verify, build, scanner]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: Download only the current attempt's scanner summary, without unpacking it
        id: summary
        if: needs.verify.outputs.attempt == github.run_attempt && needs.scanner.outputs.attempt == github.run_attempt && needs.scanner.outputs.summary-id != '' && needs.scanner.outputs.summary-digest != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scanner.outputs.summary-id }}
          path: ${{ runner.temp }}/release-report
          skip-decompress: true
          digest-mismatch: error
      - name: Report on the checked head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_HEAD: ${{ inputs.head }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          REPORT_DOWNLOADED: ${{ steps.summary.outcome == 'success' }}
        # Fetch only the trusted reporter at the workflow dispatch commit, never the PR.
        run: |
          curl --disable --proto '=https' -fsS -o "$RUNNER_TEMP/release_pr.py" \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/bot/ci/release_pr.py"
          python3 -I "$RUNNER_TEMP/release_pr.py" report "$RUNNER_TEMP/release-report"
