name: Release a Sunrise mod

on:
  workflow_call:
    inputs:
      path:
        description: Package directory relative to the repository root
        type: string
        default: '.'

permissions: {}

concurrency:
  group: sunrise-mod-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and package source
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_PATH: ${{ inputs.path }}
    outputs:
      artifact-id: ${{ steps.transfer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate package path and release tag
        run: |
          python3 -I - <<'PY'
          import os, re
          from pathlib import Path

          path = os.environ['PACKAGE_PATH']
          if path != '.' and (any(part in ('', '.', '..') for part in path.split('/')) or
                              re.search(r'[\\\x00-\x1f\x7f]', path)):
              raise SystemExit('path must be . or a repository-relative package directory without traversal')
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          package = root / path
          if package.resolve() != package or not (package / 'sunrise-mod.toml').is_file():
              raise SystemExit('path must name a package directory in the checkout, without symlinks')

          number = r'(?:0|[1-9][0-9]*)'
          identifiers = r'[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*'
          version = rf'{number}\.{number}\.{number}(?:-{identifiers})?(?:\+{identifiers})?'
          prefix = 'v' if path == '.' else r'[a-z0-9_]{1,64}/v'
          if not re.fullmatch(prefix + version, os.environ['GITHUB_REF_NAME']):
              raise SystemExit('expected v<version> at the repository root or <id>/v<version> in a subfolder')
          PY

      - name: Install the verified Linux mod tool
        run: |
          # Linux install from cargo-sunrise-mod's native release-tool.yml template.
          python3 -I - <<'PY'
          import base64, hashlib, json, os, re, shutil, subprocess, tarfile, tempfile
          from pathlib import Path

          def require(ok, message):
              if not ok:
                  raise SystemExit('mod-tool: ' + message)

          archive = 'tool-x86_64-unknown-linux-gnu.tar.xz'
          name = 'cargo-sunrise-mod'
          work = Path(os.environ['RUNNER_TEMP']) / 'sunrise-tool'
          work.mkdir()
          binary = work / name
          with tempfile.TemporaryDirectory(dir=work) as tmp:
              folder = Path(tmp)
              for asset in ('SHA256SUMS', 'SHA256SUMS.sig', 'tool.json', archive):
                  url = f'https://github.com/sunrise-org/sunrise/releases/download/mod-tool/{asset}'
                  subprocess.run(['curl', '--disable', '--proto', '=https', '--proto-redir', '=https',
                                  '-fsSL', '-o', folder / asset, url], check=True)
              # The pinned Ed25519 key and tag-bound message documented in Install the mod tool.
              sums = (folder / 'SHA256SUMS').read_bytes()
              message, key, signature = (folder / p for p in ('message', 'key.der', 'signature'))
              message.write_bytes(b'horizon release mod-tool\n' + sums)
              key.write_bytes(bytes.fromhex('302a300506032b6570032100') +
                              base64.b64decode('r53xb3cuafGxZSicLz06KC+xXp9NJdPH8snNmXo5pAc='))
              for line in (folder / 'SHA256SUMS.sig').read_bytes().splitlines():
                  if not line:
                      continue
                  signature.write_bytes(base64.b64decode(line, validate=True))
                  result = subprocess.run(['openssl', 'pkeyutl', '-verify', '-rawin', '-pubin',
                                           '-keyform', 'DER', '-inkey', key, '-in', message,
                                           '-sigfile', signature], capture_output=True)
                  if result.returncode == 0:
                      break
              else:
                  raise SystemExit('mod-tool: SHA256SUMS is not signed by Sunrise')
              for asset in ('tool.json', archive):
                  rows = re.findall(rf'^([0-9a-f]{{64}}) [ *]{re.escape(asset)}$', sums.decode(), re.M)
                  with (folder / asset).open('rb') as data:
                      require(rows == [hashlib.file_digest(data, 'sha256').hexdigest()],
                              f'{asset} does not match the signed SHA256SUMS')
              info = json.loads((folder / 'tool.json').read_bytes())
              commit = info['commit']
              require(info['schema'] == 1 and info['tag'] == 'mod-tool' and re.fullmatch(r'[0-9a-f]{40}', commit),
                      'unexpected signed tool.json')
              with tarfile.open(folder / archive, 'r:xz') as tar:
                  matches = [entry for entry in tar if entry.name.removeprefix('./') == name]
                  require(len(matches) == 1 and matches[0].isfile(), f'expected one regular {name}')
                  with tar.extractfile(matches[0]) as data, binary.open('xb') as out:
                      shutil.copyfileobj(data, out)
              binary.chmod(0o755)
              version = subprocess.check_output([binary, '--version'], cwd=folder, text=True).strip()
              require(version == f'cargo-sunrise-mod commit {commit} native-contract {info["native_contract"]}',
                      'the verified tool disagrees with its signed tool.json')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as f:
              print(work, file=f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              print(f'Signed Sunrise mod tool commit: `{commit}`', file=f)
          PY

      - name: Check and build the source package and page
        # For native mods the tool verifies and fetches the project's pinned SDK,
        # then uses the runner's rustup to install the exact compiler the SDK names.
        run: |
          cd -- "$GITHUB_WORKSPACE/$PACKAGE_PATH"
          cargo sunrise-mod check --release "$GITHUB_REF_NAME"
          cargo sunrise-mod build
          python3 -I - <<'PY'
          import os, re, shutil, tomllib
          from pathlib import Path

          with Path('sunrise-mod.toml').open('rb') as f:
              mod_id = tomllib.load(f)['id']
          if not re.fullmatch(r'[a-z0-9_]{1,64}', mod_id):
              raise SystemExit('expected a valid mod id for the release filenames')
          version = os.environ['GITHUB_REF_NAME'].split('/')[-1][1:]
          assets = Path(os.environ['RUNNER_TEMP']) / 'sunrise-assets'
          assets.mkdir()
          for extension in ('.smod', '.page.tar'):
              source = Path('target/sunrise-mod') / (mod_id + extension)
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f'cargo sunrise-mod build did not produce {source}')
              shutil.copyfile(source, assets / f'{mod_id}-{version}{extension}')
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: transfer
        with:
          name: sunrise-source-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sunrise-assets/
          if-no-files-found: error

  publish:
    name: Attest and publish source
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No checkout, tool install or execution of anything from the caller's tree.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/sunrise-assets/
          digest-mismatch: error

      - name: Validate the transferred filenames and hash the release assets
        id: assets
        working-directory: ${{ runner.temp }}/sunrise-assets
        run: |
          python3 -I - <<'PY'
          import hashlib, os, re
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          tag_id, _, leaf = tag.rpartition('/')
          version = leaf[1:]
          files = {p.name: p for p in Path.cwd().iterdir()}
          packages = [name for name in files if name.endswith('.smod')]
          if len(files) != 2 or len(packages) != 1 or not re.fullmatch(
              rf'[a-z0-9_]{{1,64}}-{re.escape(version)}\.smod', packages[0]
          ):
              raise SystemExit('expected exactly one <id>-<version>.smod and its page archive')
          mod = packages[0]
          stem = mod.removesuffix('.smod')
          page = stem + '.page.tar'
          if (tag_id and stem != f'{tag_id}-{version}') or page not in files or any(
              p.is_symlink() or not p.is_file() for p in files.values()
          ):
              raise SystemExit('expected regular source and page files matching the release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for kind, name in (('mod', mod), ('page', page)):
                  with files[name].open('rb') as f:
                      digest = hashlib.file_digest(f, 'sha256').hexdigest()
                  print(f'{kind}={name}', f'{kind}_digest=sha256:{digest}', sep='\n', file=out)
          PY

      - name: Attest the source package
        id: mod-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.assets.outputs.mod }}
          subject-digest: ${{ steps.assets.outputs.mod_digest }}

      - name: Attest the page archive
        id: page-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.assets.outputs.page }}
          subject-digest: ${{ steps.assets.outputs.page_digest }}

      - name: Release both assets and their Sigstore bundles without replacing existing files
        working-directory: ${{ runner.temp }}/sunrise-assets
        env:
          GH_TOKEN: ${{ github.token }}
          MOD: ${{ steps.assets.outputs.mod }}
          PAGE: ${{ steps.assets.outputs.page }}
          MOD_BUNDLE: ${{ steps.mod-attestation.outputs.bundle-path }}
          PAGE_BUNDLE: ${{ steps.page-attestation.outputs.bundle-path }}
        run: |
          cp -- "$MOD_BUNDLE" "$MOD.sigstore.json"
          cp -- "$PAGE_BUNDLE" "$PAGE.sigstore.json"
          assets=("$MOD" "$PAGE" "$MOD.sigstore.json" "$PAGE.sigstore.json")
          if error=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            # Without --clobber, gh rejects a same-name asset before uploading any files.
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          elif [[ "$error" == 'release not found' ]]; then
            # gh stages a new release as a draft until all four uploads complete.
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes ''
          else
            printf 'Could not look up release %s: %s\n' "$GITHUB_REF_NAME" "$error" >&2
            exit 1
          fi
