name: check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: https://github.com/${{ github.repository }}/releases/download/
      SITE: https://sunrise-org.github.io/sunrise-mods/
    steps:
      # The tool's commit and the scripts come from the base; the pull request's files are only read as data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      # The Nightly source list (README.md, "Source mods"): every entry's shape, then GitHub for new or changed
      # ones. Until main has the script (the pull request that adds it), that pull request's own copy runs.
      - name: Check the source list
        run: |
          set -o pipefail
          script=base/scripts/build_sources.py
          [ -f "$script" ] || script=head/scripts/build_sources.py
          python3 -I "$script" check base head | tee sources.txt
          { echo '### Source list'; echo '```'; cat sources.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./base/.github/actions/tool
        with:
          registry: base
      # A PR introducing these inputs still uses the older tool and scripts from main.
      - id: data
        if: hashFiles('base/.github/actions/registry-data/action.yml') != ''
        uses: ./base/.github/actions/registry-data
        # Sunrise renames its `nightly` release away before creating the next: a pull request is still checked
        # against the stable releases then, without the Nightly build.
        with:
          nightly-optional: 'true'
      - run: mkdir -p base/mods head/mods files
      - run: cargo-sunrise-mod sunrise-mod registry list head > files.txt
      # The stable native builds' signed descriptors: a build added to a published version changes this list only.
      - run: echo '[]' > descriptors.json
      - if: steps.data.outcome == 'success'
        run: cargo-sunrise-mod sunrise-mod registry list head --build-assets > descriptors.json
      # Files are named by their sha256 and rechecked on download, so a cached copy is never trusted
      # unchecked. Without the cache, each run would add one to every listed file's download count.
      - uses: actions/cache@v4
        with:
          path: files
          key: smod-files-${{ hashFiles('files.txt', 'descriptors.json') }}
          restore-keys: smod-files-
      # A stable row's file is the author's own release asset, fetched from there until the registry has its copy.
      # Each download stops at the tool's size limit, or at the size a verified descriptor gives its archive.
      - name: Download every listed file not cached
        run: python3 -I base/scripts/fetch_files.py "${{ github.repository }}" files.txt files
      # A stable native build: its signed descriptor first, then the archives the verified descriptor names.
      - name: Download the stable builds' descriptors and archives
        if: steps.data.outcome == 'success'
        run: |
          python3 -I base/scripts/fetch_files.py "${{ github.repository }}" descriptors.json files
          cargo-sunrise-mod sunrise-mod registry list head --build-assets --files files > archives.json
          python3 -I base/scripts/fetch_files.py "${{ github.repository }}" archives.json files
      # After the download: the review reads the listed files to say which mods a takedown leaves
      # without a dependency, and refuses to review a takedown without them.
      - name: Review the change against main
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -o pipefail
          cargo-sunrise-mod sunrise-mod registry review base head --author "$AUTHOR" --files files \
            ${{ steps.data.outcome == 'success' && '--releases registry-data/releases.json --sdk-data registry-data/sdk-data' || '' }} | tee review.txt
          { echo '### Registry review'; echo '```'; cat review.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the new files
        run: >-
          cargo-sunrise-mod sunrise-mod registry check base head --files files
          ${{ steps.data.outcome == 'success' && '--releases registry-data/releases.json --sdk-data registry-data/sdk-data' || '' }}
      - name: Build the index the merge would publish
        run: >-
          cargo-sunrise-mod sunrise-mod registry build head --files files --out index.json
          --release "$RELEASE" --site "$SITE" --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ${{ steps.data.outcome == 'success' && '--releases registry-data/releases.json --sdk-data registry-data/sdk-data' || '' }}
          ${{ hashFiles('registry-data/nightly-build.json') != '' && '--nightly-build registry-data/nightly-build.json' || '' }}

  # The registry's own scripts' tests, on the pull request's copy, with no token.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 -I -m unittest discover -s scripts -v
