description = """
A minimap for your HUD. It draws the terrain around you from above, as seen from the chunks your game has already loaded, and shows you as an arrow in the middle. Blocks are coloured the way the game's own maps colour them, and water and lava are shaded by depth.

- **Live.** The map redraws as you move, and when a block changes (yours, another player's, a command) that spot updates on the map.
- **Underground.** Where there is no sky above you, or in a dimension with a ceiling, the map shows the floor you are standing on and cuts walls off at eye height, so it reads as a floor plan, not as the rock overhead.
- **Loaded terrain only.** It never looks at chunks your client has not received, so it shows no more than you could see by flying up and looking down.
- **HUD behaviour.** F1 hides the map together with the rest of the HUD. If the map is in a top corner it steps aside while the F3 debug overlay is open.

## Settings

The map starts off. Turn it on in **Options → Mods → Sunrise Minimap → Config**.

| Setting | Choices | Default |
| --- | --- | --- |
| Show minimap | on / off | off |
| Corner | top left, top right, bottom left, bottom right | top right |
| Size | small, medium, large | medium |
| Round map | on / off | off |
| Blocks per pixel | 0.5, 1, 2, 4 | 1 |
| Rotate with player | on / off | off |

With **Rotate with player** off, north is always up. With it on, the map turns so that what is in front of you is at the top, and an **N** marker on the rim shows where north is.

## Client-side

This is a client-side mod: it needs to be installed only in your own game, and nothing is added to a world or a server. It does not read or send anything outside the game. It reads only what your client has loaded, so it works wherever you can already see the terrain.

Sunrise Minimap is a native mod. Sunrise builds it on your computer when you install it, and asks you to trust native code first; read the source (linked above) if you want to check what you are running.
