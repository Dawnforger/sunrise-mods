name = "SuperCam"
summary = "Hold-to-zoom with scroll, a free camera that flies while you stay put, and optional camera motion, FOV and breathing hands."
description = """
A smooth zoom you hold, a free camera that flies while your player stays put, and optional camera motion, FOV and breathing hands for Sunrise (Minecraft Java 26.3). Every part has its own switch.

## Zoom

- Hold the zoom key (C at first) to look closer; let go to come back.
- Zoom Amount (1.5x to 10x; Sunrise allows a mod up to 10x).
- Scroll To Adjust: the mouse wheel goes closer or further while the key is held, instead of changing the hotbar slot. Remember Scrolling starts the next zoom where you left it.
- Smooth (with Speed 1 to 10), or instant.
- Slower Mouse: the view turns more slowly the closer you are. Hide Hand while zoomed.
- One zoom only: no second, cinematic zoom. The spyglass still uses its own view.

## Free camera

- The free camera key (F7 at first) sends the camera out; press it again to come back.
- Your movement keys fly it (forward goes where you look, jump up, sneak down); hold sprint to go faster; the mouse wheel changes Speed (1 to 100 blocks a second).
- Your player stays exactly where you left them and can't hit, use or pick anything while the camera is out. Show Yourself, Glide and Through Blocks switches.
- Leaving the world brings the camera back.

## Camera motion, FOV and hands

- Strafe Lean and Turn Lean, Speed Dip, Jump And Fall Tilt, Idle Sway, Explosion Shake and Lightning Shake, with separate strengths for walking, flying and riding. The game's Distortion Effects setting scales all of it. SuperCam does not add damage tilt or view bobbing.
- An FOV slider (30 to 110) on SuperCam's page. It is the game's own FOV, the same one as Options, and is saved with your options.
- Breathing hands (off at first): while you stand idle, your hand and what it holds rise and settle slowly. It fades out as soon as you move, turn, swing or use something, and while the free camera is out.

SuperCam works on its own and does not need Sunrise's official Zoom mod. The settings card uses the shared Sunrise dark look; the accent is Sunrise orange `#F9801D` by default and can be changed there. Keys are under Options > Controls > SuperCam.
"""
