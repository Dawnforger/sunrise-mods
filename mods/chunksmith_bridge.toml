id = "chunksmith_bridge"
kind = "native-mod"
name = "Chunksmith Bridge"
summary = "On Chunksmith servers, shows the distant terrain the server sends (made for Distant Horizons and Voxy) in Sunrise's own far terrain."
description = """
On servers that run [Chunksmith](https://modrinth.com/mod/chunksmith), this mod lets Sunrise draw the land far beyond your view distance, including places you have never been. Chunksmith hands out level-of-detail data for Distant Horizons and Voxy. Chunksmith Bridge downloads that data and converts it into Sunrise's own far terrain, so you see mountains, coasts and biomes kilometres away.

## How it works

- When you join, the mod connects to Chunksmith (4.x or newer) and downloads the regions around you, over Chunksmith's download port or the game connection.
- Every chunk is converted into Sunrise's far-terrain files. Block and biome numbers come from the game you're playing, so colours are right, new biomes included.
- Chunks you have seen yourself are kept; a newer copy from the server replaces only what the mod wrote before. A far-terrain file the mod can't read whole is left untouched.
- Everything downloaded is ready when you join: what couldn't be written while you played is converted when you leave, or at the next start before you join. New terrain shows after you rejoin.
- No chat messages: the mod reports to `chunksmith-bridge/log.txt` in the game folder.

## Network

- When you join any server, before it knows whether the server runs Chunksmith, the mod registers the `chunksmith:lod` plugin channel (`minecraft:register`) and sends a hello on it: Chunksmith's protocol version, which formats it wants, and the download radius set in its settings. A server without Chunksmith ignores both, and the mod sends nothing more there.
- If the server answers, the mod asks it for the list of regions around you and downloads them over the game connection, or over plain HTTP from the address the server names in its answer: usually the same host on Chunksmith's download port, but the server can point to a different host. That host sees your IP address and receives the dimension and region coordinates requested and the download token the server issued.
- The mod contacts no other hosts and collects no data.

## Requirements

- Sunrise's far terrain switched on: **Options > Graphics > LOD distance** above 0.
- A server running Chunksmith with LOD data. On Paper the plugin serves over its download port (game port + 1 by default), so that port must be reachable.

## Settings

`chunksmith-bridge/settings.txt` in the game folder:

- `radius=8192`: how far around you to fetch, in blocks (512 to 16384). Every 512 × 512 region takes about 15 MB on disk: 8192 is up to ~12 GB, 16384 up to ~45 GB, if the server has that much.
- `chat=true`: show the mod's messages in the chat too.

How fine far terrain looks (cells merge past about 1 km, no small plants, opaque far water) is up to Sunrise's renderer; the data the mod writes is accurate to the block.
"""
