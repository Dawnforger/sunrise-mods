id = "chatty"
kind = "native-mod"
name = "Chatty"
summary = "Player heads beside chat names, timestamps, stacked repeats, per-server history, and a symbol picker by the chat box."
description = """
Player heads beside chat names, timestamps, repeated messages stacked with a count, chat history kept per server and world, and a symbol picker by the chat box, for Sunrise (Minecraft Java 26.3). Every part has its own switch.

## Chat heads

- Each player's face (with the hat layer) in front of their name on chat lines.
- Works with the game's own `<Name> message` and with server formats such as `Name: message`, `[Admin] Name » message`, `Name whispers to you: message`, and `* Name waves`.
- Only names in the player list (Tab) get a face, so `Server: restarting` stays plain (Only Listed Players). Show My Own Head, Head Hat Layer, and Head Position (Before Name or Line Start) are all switches.

## Timestamps and stacked repeats

- The time each message came in, at the start of its line: 12-hour or 24-hour, with or without seconds, in a colour you pick. Hover for the full date.
- The same message again, right after itself, raises a count (`(x3)`) instead of adding lines. Signed player messages never stack, since a server may delete one.

## Chat history

- The chat (up to Messages Kept, 10 to 100) and what you sent are kept when you leave and come back when you return. Every server and every single player world has its own history.
- A thin "earlier chat" line separates last time's chat from the new.
- Clear "This Server's History" or "All Chat History" in the settings (click, then click again to confirm), or `/chatty clear` and `/chatty clear all`. Files live under `sunrise-mods/.sunrise-mod-data/chatty/history/`.

## Symbol picker

- A small button at the right end of the chat box opens pages of symbols (faces and hearts, arrows, shapes, emoji, and ones you used recently). Click one to type it; Escape closes the picker. All of them are ordinary Unicode characters; ones the game's font can't draw are left out.

## Notes

- With Stack Repeats on, Sunrise's own PvP & HUD "compact chat" is used to stack; with Chatty's timestamps on, PvP & HUD's chat timestamps are held back so lines don't get two.
- The settings card uses the shared Sunrise dark look; the accent is Sunrise orange `#F9801D` by default and can be changed there. The symbol picker uses the same card and accent.
"""
