id = "sunnyf3"
kind = "native-mod"
name = "SunnyF3"
summary = "A cleaner F3 screen with titled, coloured sections you can move or hide, plus 1% lows, the in-game clock and readable names."
description = """
A cleaner F3 screen for Sunrise (Minecraft Java 26.3). While F3 is open, the debug text comes in titled sections instead of one long list; close F3 and the game is back to normal. Every F3 key combination, Sunrise's charts (F3+1 to F3+4) and the F3+F6 entry screen keep working. It shows only while you play with nothing open: the pause menu, inventories, chat and every other screen hide it.

## Sections

- **Performance**: frame rate (green, yellow or red against your monitor), frame time and the 1% low, the frame limit, VSync and refresh rate, frame generation, the server's time a tick against its budget with TPS (or a server's brand), packets in and out.
- **Position**: X, Y and Z (axis-coloured), block, chunk and the block inside it, facing with its axis, yaw and pitch, speed in blocks a second, dimension. Coordinates hide when the server asks for reduced debug info.
- **World**: biome by name, light at your feet (red where mobs can spawn), the day and the in-game time.
- **Looking At**: the block under the crosshair (name, id, position, properties with true in green and false in red) and the creature you look at with its distance.
- **System**: CPU, GPU, graphics API and driver, GPU load, memory, window size.
- **Sunrise**: Sunrise and Minecraft versions, mods running, sections and entities drawn, particles, shader pack and Sunrise GPU time, dynamic resolution, HDR, post effects.
- **Debug Entries** (hidden at first): Sunrise's own F3 lines as chosen on F3+F6, including entries other mods add.

Java and JVM details are left out: Sunrise has no JVM.

## Layout and look

- Each section: Left, Right or Hidden, and its place in the column (1 to 9).
- Style: Panels (titled panels with an accent edge), Strips (a strip per line) or Bare.
- Background opacity, section titles, text shadow, colour values, accent colour, and how often the text refreshes (50 to 1000 ms).

## Settings

The settings card uses the shared Sunrise dark look; the accent is Sunrise orange `#F9801D` by default and can be changed there. It opens from SunnyMods' **Settings** button, Sunrise's Mods list, or the mod's settings key (unbound at first, under Options > Controls > SunnyF3). With Frontier installed, its minimap steps aside while F3 is showing.
"""
