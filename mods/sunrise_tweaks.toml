id = "sunrise_tweaks"
kind = "native-mod"
name = "Sunrise Tweaks"
summary = "A click menu of small client tweaks: Auto Tool, Autoclicker, Auto Eat, Fullbright, Light Overlay, Free Look, Easy Bridge and more."
description = """
Many small client tweaks in one click menu. Press **Right Shift** to open it: one panel per category. Left-click a module to turn it on or off, right-click it for its settings, and set every module's key right there.

## Overlays

- **Light Overlay:** marks spots where mobs can spawn (red: always, yellow: only at night).
- **Fullbright:** everything is bright, even in caves and at night.
- **No Darkness:** no dimming and no fog from the Darkness effect.
- **No Pumpkin:** no pumpkin blur while you wear a carved pumpkin.
- **Weather:** your own weather (clear, rain or thunder), only visible to you.

## Automation

- **Auto Tool:** switches to the fastest fitting tool while you mine, and back afterwards; can spare tools that are almost broken.
- **Autoclicker:** left or right, at a set CPS or whenever the attack cooldown is full, with an optional HUD.
- **Auto Eat:** eats the best food from your hotbar when you get hungry and skips food that poisons you.

## Conveniences

- **Free Look:** hold a key to look around freely while you keep walking straight.
- **Easy Bridge:** look down and hold right-click with a block; the block goes in front of you, like in Bedrock.

Some servers don't allow automation such as autoclickers. Check a server's rules before you use them there.

The menu key can be changed in **Options > Controls** or on the mod's Config page.
"""
