name = "SuperCapes"
summary = "Cape cloth that moves with the player, plus public cape pictures (OptiFine and MinecraftCapes by default)."
description = """
Cape cloth that moves with the player, and public cape pictures for you and other players, with a settings card. No extra keybind.

## Network and privacy

With **Online capes** on (the default), SuperCapes asks each enabled source for the cape of every player you can see. It sends only the player's name or UUID. **OptiFine** and **MinecraftCapes** are on by default. LabyMod and Cloaks are off.

- Requests go out from a background thread with the User-Agent `SuperCapes/1.0.0`.
- It sends no cookies, account tokens, telemetry, or machine or hardware IDs.
- Turn **Online capes** off and it makes no requests. **Only me** limits lookups to your own name.

## Features

- Open the settings card with the **SuperCapes** button on the pause menu (directly above **Save and Quit to Title**), or with `/supercapes panel`. The button is a regular game button, so resource packs restyle it.
- A segmented cape driven only by how the player moves: walking sends a ripple down it, it lifts when you run or fall, swings sideways when you strafe or turn, and hangs straight down when you stand still. There is no wind.
- Style: **Smooth** (segmented cloth, the default) or **Blocky** (the rigid vanilla cape, with vanilla physics). Smooth settings include ripple, quality (8, 16 or 24 segments), weight and ripple strength.
- One cape per player. The first enabled source's picture wins, else the player's own cape. With an elytra on, the winning picture can go on the wings (on by default).
- OptiFine capes, including HD ones (92x44, 184x88), fit the vanilla cape box exactly.
- Public cape sources are tried in the order you set. **Animated capes** plays stacked sprite sheets and GIFs (on by default). Official Mojang capes stay when no enabled source has a picture. Pictures are cached, so a player's cape is downloaded once.

## Settings

The settings card has Motion, Sources and About tabs, and uses the shared Sunrise dark look. The accent is Sunrise orange `#F9801D` by default and can be changed there. It also opens from SunnyMods' **Settings** button, Sunrise's Mods list, or the mod's settings key.
"""
