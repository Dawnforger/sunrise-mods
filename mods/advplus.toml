id = "advplus"
kind = "native-mod"
name = "Advancements+"
summary = "A clearer Advancements screen with a full tree, search and filters, plus on-screen plaques in place of the stock toasts."
description = """
A clearer Advancements screen for Sunrise (Minecraft Java 26.3), with a full-window tree (or a list), search and filters, plus short on-screen plaques in place of the stock toasts. Fully offline: it makes no network requests.

## Features

- Click **Advancements** on the pause menu, or press the existing Advancements key (L by default), to open Advancements+. `/advplus panel` does the same. There is no extra keybind.
- The stock Advancements widgets are not drawn. The world stays blurred and dimmed, and only the Advancements+ card appears.
- Tabs for each advancement root, labelled with the translated title and that tab's progress (for example "Adventure 3/45").
- A large tree view laid out from parent links. Chain-heavy tabs stay left-to-right; wide tabs with many siblings of the root switch to a top-down tree, wrapping a very wide level into a grid with a shared bus line. Drag to pan; the mouse wheel steps zoom through 75%, 100%, 125% and 150% around the cursor. Elbow lines join a child to its visible parent only, drawn under the icons.
- Distinct frame shapes: a square for tasks, a clipped octagon for goals, and a double frame with pips for challenges, with clearer done/undone colouring.
- A list mode alternative, with one-row-per-notch scrolling.
- Search by title or id, and a filter that cycles All / Done / Active / Locked.
- Titles, descriptions, tab names and plaques use the game's language lookup. Hover tooltips show the title, description, frame type, and criteria already completed or still remaining.
- Advancement toasts are replaced with a short top- or bottom-of-screen plaque (icon, title, frame-type accent, slide in and out). Vanilla toast sounds are used. Recipes can be hidden. Plaques can be turned off, in which case the game's own toasts remain.

## Settings

Settings persist in `advplus.cfg` and cover plaques on or off, duration, which frame types to show, recipe plaques, plaque position, and the default tree or list view. The card uses the shared Sunrise dark look; the accent is Sunrise orange `#F9801D` by default and can be changed in the settings card (SunnyMods' **Settings** button, Sunrise's Mods list, or the mod's settings key).
"""
