id = "sunnymods"
kind = "native-mod"
name = "SunnyMods"
summary = "A better Mods list for Sunrise, with each mod's icon, version, authors, description, keys and a Settings button."
description = """
A better Mods list for Sunrise (Minecraft Java 26.3). It takes over the title screen's **Mods** button and **Options > Mods...**. Nothing else changes; turn "Use SunnyMods" off on its settings page (or press **Sunrise List** at the bottom) to see Sunrise's list again.

## The list

- Each mod's own `icon.png`, sharp at 32 px (20 px in compact rows); a lettered tile for mods without one.
- Name, version, authors and the first sentence of the description on every row, with a status dot (green running, grey not loaded, red failed, purple dev) and a gear for mods with a settings page.
- Search by name, id, author, licence or description. `@name` looks only at the authors, `#id` only at the ids. Typing anywhere starts a search; Ctrl+F focuses it.
- Filter chips: All, Running, Settings (mods with a settings page), Issues (failed, not loaded, or with loading notices). Tab steps through them.
- Sort: name A to Z, Z to A, author, or settings first.
- Only mods are listed: the game and Sunrise themselves are left out.

## The panel

- A 64 px icon, the name, version and `#id` (click to copy), the status, and how many settings and keys the mod has.
- Authors, licence (a link when the mod gives one), credits, the full description, the keys the mod adds with what they are bound to now, any failure and loading notices.
- **Settings** opens the mod's settings page (Done or Escape comes back to the list); **Website** and **Issues** open the mod's links after Sunrise's confirmation. A second click on the selected mod, or Enter, also opens its settings.

## Footer and keys

- **Browse Mods** (Sunrise's mod browser), **Mods Folder**, **Sunrise List** and **Done**.
- Open the Mods List is unbound at first (Options > Controls > SunnyMods). From play it opens the list straight away.
- On the list: arrows, Page Up/Down, Home/End to move, Enter for Settings, Tab for the chips, Escape to leave the search box or the list.

Which mods run is still the launcher's choice, as in Sunrise's own list. The pre-load startup menu keeps Sunrise's list.

## Settings

Use SunnyMods, Sort, Rows (comfortable or compact), Show Mod IDs, and Accent Colour. The list uses the shared Sunrise dark look; the accent is Sunrise orange `#F9801D` by default and can be changed in the settings card.
"""
authors = ["Zekrenlight"]
