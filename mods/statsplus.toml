id = "statsplus"
kind = "native-mod"
name = "Statistics+"
summary = "A clearer Statistics screen with tabs, search, sorting, grouping, units, and local snapshots. Fully offline."
description = """
A clearer Statistics screen for Sunrise (Minecraft Java 26.3): tabs, search, sorting, grouping, units, and local snapshots. Fully offline. It makes no network requests of its own; the only traffic is the game's own request-stats command to the server you are playing on.

## Features

- Click **Statistics** on the pause menu, or run `/statsplus panel`, to open Statistics+.
- When a server is connected, the client requests a fresh stats update (the ordinary request-stats command). The list then follows the values the game already holds.
- Views: **General**, **Items**, **Blocks**, **Mobs**, **Food**, and **Files**.
- On the Mobs tab, a category chip cycles **All** / **Hostile** / **Passive**. Hostile is the game's `monster` category; Passive covers the rest.
- Search by name or id. Sort by listed order, name, or value. Toggle **Filled** / **All** to hide or show empty rows. Group by kind on the Mobs tab; source grouping (by namespace) appears automatically when a tab includes more than one namespace.
- Distance units cycle cm / m / km. Time units cycle ticks / seconds / minutes / hours / days.
- The mouse wheel moves one row per notch. The card stays inside the window with margins, even in a small or narrow window or at a larger GUI scale.
- Items, blocks and food show item icons. Mobs show a card with a spawn-egg icon when the game has one.
- Optional JSON snapshots live under the mod data directory, in a `snapshots` folder. Save and load from the Files tab, or `/statsplus save` and `/statsplus load [name]`. There is no operating-system file picker, and nothing is uploaded.

## Settings

The Statistics screen uses the shared Sunrise dark look; the accent is Sunrise orange `#F9801D` by default and can be changed in the settings card (SunnyMods' **Settings** button, Sunrise's Mods list, or the mod's settings key).
"""
