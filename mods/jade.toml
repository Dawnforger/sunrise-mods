id = "jade"
kind = "native-mod"
name = "Jade"
summary = "Shows what you are looking at: the block, fluid or entity, its mod, harvest tool and contents. A port of Jade to Sunrise."
description = """
An unofficial port of **Jade** (by Snownee, CC BY-NC-SA 4.0) to Sunrise's mod API. The Rust code is a rewrite of Jade's logic; its themes and language files are the original mod's.

## What it adds

- **The overlay** for blocks, fluids and entities: name, icon, mod, harvest tool, breaking progress, containers' contents and energy, and lines other mods add.
- **Themes**, including ones a resource pack adds, plus scale, position, opacity and fade settings.
- **Config screens and profiles**, keys (Show Recipes, Show Uses, Narrate, Show Details, profiles) and the `/jadec` and `/jade` commands.
- **Multiplayer safety:** the server only answers for what a player can reach, and keeps command blocks and loot tables to operators.

## For mod makers

Jade's provider API lets a mod add lines for its own blocks and entities.
"""
authors = ["Snownee", "Joeypc6"]
