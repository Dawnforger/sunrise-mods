id = "frontier"
kind = "native-mod"
name = "Frontier"
summary = "A minimap and saved world map with layered cave views, waypoints, and an entity radar for nearby players, mobs, and dropped items."
description = """
A minimap, a world map of everywhere you have been, waypoints, and an entity radar for Sunrise (Minecraft Java 26.3). Maps and waypoints are kept per server or single-player world and per dimension.

## Minimap

- Round (the default) or square, in any corner, with a **Plain** frame (a dark rim, the default), a **Parchment** frame, or none.
- 64 GUI pixels wide at first (up to 192); north up, or turning with you; five zoom levels; your coordinates and biome under the map (each can be turned off).
- Cave mode: underground, or under any roof — glass domes and glass roofs included — the map shows the floor around you instead of the surface. Cover overhead pre-warms the cave picture, and a column not yet read keeps the surface during the fade, so walking down a long staircase never flashes or pops. The two pictures crossfade smoothly.

## World map (M)

- Everything you have seen, saved in 256×256-block region files per world or server and per dimension.
- **Surface** and **cave layers**: caves are cut in 16-block layers of height, each saved on its own, so a base, a deep cave and the inside of a dome never write over one another or the surface. The map opens in the view you are in, cut just over your head under a roof or dome, and it follows you up and down. **Surface | Cave** (or C) and layer steppers (or [ / ], Page Down / Page Up) switch the view at once.
- Drag to move, scroll to zoom, and a small compass in the bottom right (toggle).
- A **?** in the top bar lists the keys while you point at it; nothing else is written over the map, so it fits narrow screens too.
- Right-click for a menu (toggle), titled with the biome there: add, edit or remove a waypoint, copy coordinates, share in chat, and open Frontier settings. In Creative or Spectator with `/tp` permission, **Teleport here** (toggle) puts you on the ground there or on the floor of the cave layer shown.

## Waypoints

- B makes one where you stand; J lists them. Shown on the minimap (far ones on its edge) and on the world map, and in the world as coloured beams and name + distance labels.
- A Last Death waypoint (toggle) appears where you died and clears itself when you get back. The world map's right-click menu edits and removes waypoints too.

## Creatures, items and markers

- An entity radar on both maps: red for monsters, green for animals, yellow for villagers, and white for other players, who show their skin's face. Only what is on the layer you are looking at is shown (other players always are): in cave mode, within about 5 blocks of your height or that cave layer's floor; on the surface, mobs, items and things under the ground are hidden.
- Dropped items (on at first) as small black dots; pointing at one on the world map names it. While Tab is held, each one is drawn as its item's own icon (with your resource packs, on no backing) and its real name (a custom name, or the item's name in your language, with the count).
- Creatures another mod draws with its own renderer show the marker image their mod or a resource pack ships at `assets/<namespace>/textures/frontier/markers/<path>.png`, else a dot.
- Optional things (item frames, armour stands, minecarts, boats and the like) and block markers for storage and decorations, off at first.

## Settings

The settings card uses the shared Sunrise dark look; the accent is Sunrise orange `#F9801D` by default and can be changed there. It opens from Sunrise's Mods list, Options > Mods, or the settings key (K at first).
"""
