sha256 = "223ce1d2ec34e2718825e12bd792a1258ebc056546641ffd56b8d66b5ea8d14c"
changelog = "Security fix from the Horizon registry's review: a ritual satchel builds only for a player who may build (not in adventure or spectator mode), when the place clicked is within reach and part of the previewed pentacle, and only inside the world border; at most 4 builds wait per player and they go when the player leaves. Before, a modified client could make a satchel build anywhere in a loaded area. Nothing else changed in game."
