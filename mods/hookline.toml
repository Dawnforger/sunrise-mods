name = "Hookline"
summary = "Client-side AFK fishing helper: reel on your own bobber splash, recast, keep or toss catch, deposit into a chest, and eat."
description = """
A client-side AFK fishing helper for Sunrise (Minecraft Java 26.3). It reels when **your** bobber splashes, recasts, and can keep or toss catches, deposit kept catch into a chest or barrel, and eat from the off-hand or hotbar.

It drives ordinary client actions (the use key, hotbar selection, and inventory clicks). It does not talk to the server through a custom protocol. Use only on servers and worlds where AFK fishing and this kind of automation are allowed.

## Features

- Toggle with **V**; open the panel with **O** (both rebindable under Options > Controls). The toggle shows a short action-bar message.
- Bite detection uses your own bobber splash, with a short settle window after a cast.
- Pace variance (on by default) waits a little before reeling and stretches recast and meal pauses with non-uniform jitter.
- Catch list order: Enchanted Book, Fishing Rod, Bow, Salmon, Cod, Tropical Fish, Pufferfish, then the rest of the usual catch. Each row is Keep or Toss. The in-use rod is never thrown.
- Books, rods and bows also use per-enchant rules. Mending wins if it is present; otherwise the closest-to-max vote wins; a tie keeps the item. Unlisted enchants do not vote. The item row is the master switch.
- Tosses go through inventory-click actions, including items in the main inventory.
- When the bag is almost full, Hookline can deposit **kept catch only** into a chest or barrel it opened, then cool down.
- Optional meals: looks in the off-hand, then the hotbar only, and eats one item at a time until hunger is full, with a pause between bites.
- Optional idle rest after five minutes with no bite, reel or recast. Optional look-around, switch or stop on a worn rod, and leave the server below three hearts.
- Session ledger and per-item catch chimes.

## Settings

The fishing panel opens with **O** or `/hookline panel`. Habits also appear as toggles in Hookline's settings card (SunnyMods' **Settings** button, Sunrise's Mods list, or Options > Mods). The card uses the shared Sunrise dark look; the accent is Sunrise orange `#F9801D` by default and can be changed there.
"""
