id = "shulker_tooltip"
kind = "native-mod"
name = "Shulker Tooltip"
summary = "Hold Ctrl over a shulker box to see its contents as a colour-matched 9x3 grid in the tooltip."
description = """
See what's inside a shulker box without placing it.

- Hover over a shulker box and hold **Left Ctrl**: its contents appear as a 9×3 grid right in the tooltip, laid out like the box itself.
- While the grid is shown, the long item list disappears and only the box name stays.
- The slots are tinted in the box's colour and the tooltip border uses a lighter shade of it. The colour is read from the game at runtime.
- Without the key, the tooltip stays exactly as in vanilla.

## Settings

- **Options > Controls:** the key that shows the contents.
- **Options > Mods > Shulker Tooltip > Config:** use that key, or Ctrl, Shift, Alt, or show the grid always.
"""
authors = ["Galaxis_Boarder"]
