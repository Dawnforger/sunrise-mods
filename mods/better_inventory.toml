id = "better_inventory"
kind = "native-mod"
name = "Better Inventory"
summary = "Sort buttons and a sort key, quiet hotbar auto-refill, armour durability beside the hotbar, and a pickup list."
description = """
Sort buttons and a sort key, quiet hotbar auto-refill, armour and held items with their wear beside the hotbar, a hotbar that can glide and lift the held item, and a list of what you pick up in a corner of the screen, for Sunrise (Minecraft Java 26.3). Every part has its own switch.

## Sorting

- A small sort button by your inventory, and by chests, barrels and shulker boxes (Sort Buttons).
- The sort key (R at first) sorts the part under the cursor: your inventory, or the container.
- Part stacks are joined, then stacks line up by Sort Order: Groups (the creative inventory's order), Name, or Amount. The hotbar is left alone.
- It sorts with ordinary left clicks, the same ones you would make, so it works on servers.

## Auto-refill

- When the stack in your hand runs out or your tool breaks, the next matching stack from your inventory moves into that hotbar slot (Auto-Refill, on at first).
- Refill Off Hand: the off hand too. Refill With Similar Tools: any pickaxe for a broken pickaxe.
- Dropping (Q) or swapping hands (F) doesn't refill. No sounds, flashes or warnings, ever.

## Equipment HUD, hotbar motion and pickup list

- Your armor and what you hold, beside the hotbar, with wear shown as percent, a bar, uses left, or the icon alone.
- Optional hotbar motion: Gliding Selection, Springy Selection, Bigger Held Item, Item Wobble and Use Squeeze. With all of these off, the game draws its own hotbar untouched.
- Items, experience and arrows (and tridents) you pick up are listed in a corner of the screen: icon, name and amount. Pickup List Corner, time, lines and size are all configurable.

## Settings

The sort key is in Options > Controls. The settings card uses the shared Sunrise dark look; the accent is Sunrise orange `#F9801D` by default and can be changed there. It opens from SunnyMods' **Settings** button, Sunrise's Mods list, or the mod's settings key.
"""
