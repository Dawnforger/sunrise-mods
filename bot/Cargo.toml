[package]
name = "registry-bot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
percent-encoding = "2.3"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
toml = "1"
url = "2"
